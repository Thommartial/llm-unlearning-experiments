# Federated campaign (ANALYSIS_PLAN §8): DistilGPT-2, GPT-2, GPT-2-medium x seeds 0-4,
# K = 5 clients, iid. FedAvg once per (model, seed), then federated retrain and client GA
# (upload and post-recovery views).
name: fed_iid
seed: 0
output_dir: results/revision
device: auto
model:
  name: gpt2
  precision: fp16_amp
data:
  dataset: tofu_official
  max_length: 128
  outlier_fraction: 0.3
  tofu_metrics: true
  max_new_tokens: 128
unlearn:
  finetune_epochs: 3
  finetune_lr: 2.0e-05         # set from pilot (rule 1: 2e-5 or 5e-5)
  train_batch_size: 16
  epochs: 2
  learning_rate: 1.0e-5
  batch_size: 4
  eval_batch_size: 64
  grad_accum_steps: 1          # GPT-2-medium: 2 (its variant below), micro-batches of 8
  retain_weight: 1.0
  beta: 0.1
attack:
  min_k: 0.2
  grad_alignment: true
federated:
  num_clients: 5
  sharding: iid
  rounds: 8                    # set from pilot (rule 2: 3, 5 or 8)
  local_epochs: 1
  client_unlearn_epochs: 2
  rho_factor: 2.0              # set from pilot (rule 3: 0.5, 1 or 2)
  recovery_rounds: 2
  accumulate_on_device: true
campaign:
  models: [distilgpt2, gpt2, gpt2-medium]
  seeds: [0, 1, 2, 3, 4]
  requires: [unlearn.finetune_lr, federated.rounds, federated.rho_factor]
  variants:
    - {name: iid_K5, kind: federated, models: [distilgpt2, gpt2]}
    # same settings and effective batch 16; 2 x 8 records per step to fit a T4 (memory probe)
    - {name: iid_K5, kind: federated, models: [gpt2-medium], unlearn: {grad_accum_steps: 2}}
