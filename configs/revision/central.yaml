# Central campaign (ANALYSIS_PLAN §2-§6): DistilGPT-2, GPT-2, GPT-2-medium x seeds 0-4.
# Fine-tune once per (model, seed), then retrain, GA, GD, NPO; both non-member sets,
# TOFU metrics, update-signal attacks and costs in every row.
name: central
seed: 0
output_dir: results/revision
device: auto
model:
  name: gpt2
  precision: fp16_amp
data:
  dataset: tofu_official
  max_length: 128
  outlier_fraction: 0.3
  tofu_metrics: true
  max_new_tokens: 128
unlearn:
  finetune_epochs: 3
  finetune_lr: 2.0e-05         # set from pilot (rule 1: 2e-5 or 5e-5)
  train_batch_size: 16
  epochs: 2
  learning_rate: 1.0e-5
  batch_size: 4
  eval_batch_size: 64
  retain_weight: 1.0
  beta: 0.1
attack:
  min_k: 0.2
  grad_alignment: true
campaign:
  models: [distilgpt2, gpt2, gpt2-medium]
  seeds: [0, 1, 2, 3, 4]
  requires: [unlearn.finetune_lr]
  variants:
    - {name: central, kind: central}
