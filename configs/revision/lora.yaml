# LoRA campaign (ANALYSIS_PLAN §2, §3): TinyLlama v1.1 x seeds 0-4, central path, LoRA
# adapters on frozen fp16 base weights; the NPO reference is a second adapter.
name: lora
seed: 0
output_dir: results/revision
device: auto
model:
  name: TinyLlama/TinyLlama_v1.1
  precision: fp16_amp
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:            # by the loaded model's model_type
      llama: [q_proj, k_proj, v_proj, o_proj]
      gpt_neox: [query_key_value, dense]   # Pythia
    base_dtype: float16
    gradient_checkpointing: true
data:
  dataset: tofu_official
  max_length: 128
  outlier_fraction: 0.3
  tofu_metrics: true
  max_new_tokens: 128
unlearn:
  finetune_epochs: 3
  finetune_lr: 0.0002          # set from pilot (rule 1, LoRA: 1e-4 or 2e-4)
  train_batch_size: 16
  epochs: 2
  learning_rate: 0.0001        # set from pilot (1e-5 x LoRA fine-tune lr / full fine-tune lr)
  batch_size: 4
  eval_batch_size: 64
  retain_weight: 1.0
  beta: 0.1
attack:
  min_k: 0.2
  grad_alignment: true
campaign:
  models: [TinyLlama/TinyLlama_v1.1]
  seeds: [0, 1, 2, 3, 4]
  requires: [unlearn.finetune_lr, unlearn.learning_rate]
  variants:
    - {name: lora, kind: central}
